name: Sandbox debt and popup verification

on:
  pull_request:
    branches: [sandbox/ux-agent]

jobs:
  verify-debt-treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx scripts/verify-debt-treatment.ts
