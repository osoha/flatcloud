name: Agent intake dry run

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open agent-ready Issue number
        required: true
        type: number

permissions:
  contents: read
  issues: read

jobs:
  validate-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch issue without executing its content
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issueNumber = Number(${{ inputs.issue_number }});
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("issue_number must be a positive integer");
              return;
            }
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            fs.writeFileSync("agent-issue.json", JSON.stringify({
              number: data.number,
              title: data.title,
              body: data.body,
              state: data.state,
              html_url: data.html_url,
            }));

      - name: Validate agent intake contract
        run: >-
          node scripts/validate-agent-issue.mjs
          --issue-file agent-issue.json
          --audit-file agent-intake-audit.md

      - name: Upload non-sensitive audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-intake-audit-${{ inputs.issue_number }}
          path: agent-intake-audit.md
          if-no-files-found: error
          retention-days: 7
