name: Admin and property polish
on:
  pull_request:
    branches: [main, sandbox/ux-agent]
    paths:
      - 'app/nastaveni/**'
      - 'app/nemovitosti/**'
      - 'app/ukoly/**'
      - 'app/api/tasks/**'
      - 'components/HistoryTable.tsx'
      - 'lib/documents/**'
      - 'lib/housing-responsibility.ts'
      - 'e2e/admin-property-polish.spec.ts'
      - '.github/workflows/admin-property-polish.yml'
jobs:
  admin-property-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_property_polish
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admin_property_polish?schema=public
      SESSION_SECRET: user-settings-test-isolated-session-secret-2026
      INITIAL_ADMIN_EMAIL: e2e.admin@flatcloud.test
      INITIAL_ADMIN_PASSWORD: FlatCloud-E2E-Only-Password-2026
      INITIAL_ADMIN_NAME: E2E administrátor
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run e2e:seed
      - run: npm run e2e:seed:r24-roles
      - run: node --import tsx scripts/verify-task-assignee-and-attention.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/admin-property-polish.spec.ts e2e/document-catalog-scope.spec.ts e2e/property-team-setup.spec.ts e2e/meter-reading-history.spec.ts e2e/meter-task-automation.spec.ts e2e/bank-account-lifecycle.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-property-polish-evidence
          path: test-results/
          retention-days: 7
