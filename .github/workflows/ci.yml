name: FlatCloud CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatcloud_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flatcloud_ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run verify:v20
      - run: npm run verify:v21
      - run: npm run verify:v21.1
      - run: npm run verify:v21.2
      - run: npm run verify:v21.3
      - run: npm run verify:v21.3.4
      - run: npm run verify:v21.3.5
      - run: npm run verify:v21.3.6
      - run: npm run verify:v21.4
      - run: npm run build
