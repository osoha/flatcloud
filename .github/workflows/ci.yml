name: FlatCloud CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatcloud_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flatcloud_ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run verify:v20
      - run: npm run verify:v21
      - run: npm run verify:v21.1
      - run: npm run verify:v21.2
      - run: npm run verify:v21.3
      - run: npm run verify:v21.3.4
      - run: npm run verify:v21.3.5
      - run: npm run verify:v21.3.6
      - run: npm run verify:v21.4
      - run: npm run verify:gdrive-storage-1
      - run: npm run verify:identity-1
      - run: npm run verify:gdrive-structure-2
      - run: npm run verify:vs-structure-1
      - run: npm run verify:lease-report-heavy-1
      - run: npm run verify:v23-a
      - run: npm run verify:v23-b
      - run: npm run verify:v23-c
      - run: npm run verify:mail-retention-1
      - run: npm run verify:v21.6
      - run: npm run verify:v21.6.1
      - run: npm run verify:v21.7
      - run: npm run verify:v22
      - run: npm run verify:v22-b
      - run: npm run verify:v22-b1
      - run: npm run verify:v22-c-part1
      - run: npm run verify:v22-c-part1-1
      - run: npm run verify:v22-c-part2a1
      - run: npm run verify:v22-c-part2a2a
      - run: npm run verify:v22-c-part2a2b
      - run: npm run verify:v22-c-part2ba1
      - run: npm run verify:v22-c-part2ba2
      - run: npm run verify:v22-c-part2ba3a
      - run: npm run verify:v22-c-part2ba3b
      - run: npm run verify:v22-c-part2ba3b0
      - run: npm run verify:v22-c-part2ba3b1
      - run: npm run verify:v22-c-part2ba3b2
      - run: npm run verify:v22-c-part2ba3b3
      - run: npm run verify:v22-c-payments1
      - run: npm run verify:v22-c-payments2a
      - run: npm run verify:v22-c-inactive-property-notifications
      - run: npm run verify:lease-reactivate-1
      - run: npm run verify:report-design-1
      - run: npm run verify:report-design-2
      - run: npm run verify:report-design-2-1
      - run: npm run verify:report-design-2-1-upload
      - run: npm run verify:report-design-3a
      - run: npm run verify:report-design-3b
      - run: npm run verify:report-design-3b1
      - run: npm run verify:report-design-3b2
      - run: npm run verify:report-design-3b3
      - run: npm run verify:report-design-3b4
      - run: npm run verify:report-design-4a
      - run: npm run verify:report-trends-1
      - run: npm run verify:mf-rent-1
      - run: npm run verify:portfolio-deposit-polish
      - run: npm run build
      - run: npm run verify:ux-remodel-r1
      - run: npm run verify:ux-remodel-r2
      - run: npm run verify:ux-remodel-r3
      - run: npm run verify:ux-remodel-r3b
      - run: npm run verify:ux-remodel-r2d
      - run: npm run verify:live-report-periods

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatcloud_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flatcloud_e2e?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: flatcloud-e2e-session-secret-at-least-32-characters
      INITIAL_ADMIN_EMAIL: e2e.admin@flatcloud.test
      INITIAL_ADMIN_PASSWORD: FlatCloud-E2E-Only-Password-2026
      INITIAL_ADMIN_NAME: E2E administrátor
      E2E_ADMIN_EMAIL: e2e.admin@flatcloud.test
      E2E_ADMIN_PASSWORD: FlatCloud-E2E-Only-Password-2026
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run e2e:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
