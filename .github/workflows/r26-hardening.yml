name: R26 Hardening

on:
  pull_request:
    branches: [sandbox/ux-agent]

jobs:
  r26-verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatcloud_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flatcloud_ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: node --import tsx scripts/verify-r26c2-meter-hierarchy.ts
      - run: node --import tsx scripts/verify-r26d2-allocation.ts
      - run: node --import tsx scripts/verify-r26d2-allocation-service.ts
      - run: node --import tsx scripts/verify-r26ef-workflow.ts
