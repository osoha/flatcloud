name: Subscription sandbox
on:
  pull_request:
    branches: [main, sandbox/ux-agent]
    paths:
      - 'lib/subscriptions/**'
      - 'lib/subscription-portfolio-view.ts'
      - 'components/subscriptions/**'
      - 'app/api/subscriptions/**'
      - 'app/api/admin/subscriptions/**'
      - 'app/nastaveni/tarify/**'
      - 'app/ucet/predplatne/**'
      - 'app/uzivatele/**'
      - 'app/portfolio/**'
      - 'app/api/display-mode/**'
      - 'lib/auth.ts'
      - 'lib/display-mode.ts'
      - 'components/Shell.tsx'
      - 'components/ShellSubscriptionNotice*'
      - 'components/DisplayModeSwitch.tsx'
      - 'components/admin/AdminSubnav.tsx'
      - 'app/nastaveni/page.tsx'
      - 'app/ucet/page.tsx'
      - 'app/api/auth/register/**'
      - 'proxy.ts'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'scripts/verify-subscriptions.ts'
      - 'e2e/subscriptions.spec.ts'
      - 'e2e/user-settings-portal.spec.ts'
      - 'e2e/basic-owner-mode.spec.ts'
      - 'e2e/property-team-setup.spec.ts'
      - 'e2e/portal-receipts-and-scope.spec.ts'
      - 'e2e/lease-contract-generator.spec.ts'
      - 'e2e/r32-user-context.spec.ts'
      - '.github/workflows/subscriptions-sandbox.yml'
jobs:
  subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subscriptions_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subscriptions_test?schema=public
      SESSION_SECRET: subscriptions-test-isolated-session-secret-2026
      INITIAL_ADMIN_EMAIL: e2e.admin@flatcloud.test
      INITIAL_ADMIN_PASSWORD: FlatCloud-E2E-Only-Password-2026
      INITIAL_ADMIN_NAME: E2E administrátor
      NEXT_TELEMETRY_DISABLED: '1'
      FLATBERRY_SUBSCRIPTIONS_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run e2e:seed
      - run: node --import tsx scripts/verify-subscriptions.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/subscriptions.spec.ts e2e/user-settings-portal.spec.ts --reporter=line
      - run: npx playwright test e2e/basic-owner-mode.spec.ts e2e/property-team-setup.spec.ts e2e/portal-receipts-and-scope.spec.ts e2e/lease-contract-generator.spec.ts --output=test-results/native-regression --reporter=line
        env:
          FILE_STORAGE_DRIVER: s3
          S3_ENDPOINT: http://127.0.0.1:3201
          S3_REGION: eu-central-1
          S3_BUCKET: qa-documents
          S3_FORCE_PATH_STYLE: 'true'
          S3_ACCESS_KEY_ID: qa-only
          S3_SECRET_ACCESS_KEY: qa-only
      - run: >-
          npx playwright test e2e/r32-user-context.spec.ts --grep 'R32B: target content' --output=test-results/native-preview --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-sandbox-evidence
          path: test-results/
          retention-days: 7
