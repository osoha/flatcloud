name: User settings and tenant portal
on:
  pull_request:
    branches: [main, sandbox/ux-agent]
    paths:
      - 'app/uzivatele/**'
      - 'app/api/users/**'
      - 'app/api/portal/**'
      - 'app/portal/**'
      - 'components/TenantPortalMessages.tsx'
      - 'components/tenant-portal/**'
      - 'lib/tenant-portal-*.ts'
      - 'lib/tenant-contact-requests.ts'
      - 'lib/portal-bank-notices.ts'
      - 'lib/submitted-user-permissions.ts'
      - 'scripts/verify-submitted-user-permissions.ts'
      - 'e2e/user-settings-portal.spec.ts'
      - 'e2e/bank-account-lifecycle.spec.ts'
      - '.github/workflows/user-settings-portal.yml'
jobs:
  user-settings-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_settings_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/user_settings_test?schema=public
      SESSION_SECRET: user-settings-test-isolated-session-secret-2026
      INITIAL_ADMIN_EMAIL: e2e.admin@flatcloud.test
      INITIAL_ADMIN_PASSWORD: FlatCloud-E2E-Only-Password-2026
      INITIAL_ADMIN_NAME: E2E administrátor
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run e2e:seed
      - run: npm run e2e:seed:r24-roles
      - run: node --import tsx scripts/verify-submitted-user-permissions.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/user-settings-portal.spec.ts e2e/bank-account-lifecycle.spec.ts e2e/tenant-portal-conversations.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-settings-portal-evidence
          path: test-results/
          retention-days: 7
