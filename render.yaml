services:
  - type: web
    name: flatcloud-rent
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --no-audit --no-fund && npm run build
    preDeployCommand: npm run db:migrate && npm run db:bootstrap
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: DATABASE_URL
        fromDatabase:
          name: flatcloud-rent-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BANK_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.fortion.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: FlatCloud
      - key: SMTP_FROM_EMAIL
        sync: false

  - type: cron
    name: flatcloud-rent-payment-email
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm ci --no-audit --no-fund && npx prisma generate
    startCommand: npm run payments:email:cron
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: DATABASE_URL
        fromDatabase:
          name: flatcloud-rent-db
          property: connectionString
      - key: BANK_TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: flatcloud-rent
          envVarKey: BANK_TOKEN_ENCRYPTION_KEY
      - key: SESSION_SECRET
        fromService:
          type: web
          name: flatcloud-rent
          envVarKey: SESSION_SECRET

  - type: cron
    name: flatcloud-rent-notifications
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm ci --no-audit --no-fund && npx prisma generate
    startCommand: npm run rent:notifications:cron
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: DATABASE_URL
        fromDatabase:
          name: flatcloud-rent-db
          property: connectionString
      - key: BANK_TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: flatcloud-rent
          envVarKey: BANK_TOKEN_ENCRYPTION_KEY
      - key: SESSION_SECRET
        fromService:
          type: web
          name: flatcloud-rent
          envVarKey: SESSION_SECRET
      - key: SMTP_HOST
        value: smtp.fortion.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        fromService:
          type: web
          name: flatcloud-rent
          envVarKey: SMTP_USER
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: flatcloud-rent
          envVarKey: SMTP_PASSWORD
      - key: SMTP_FROM_NAME
        value: FlatCloud
      - key: SMTP_FROM_EMAIL
        fromService:
          type: web
          name: flatcloud-rent
          envVarKey: SMTP_FROM_EMAIL

databases:
  - name: flatcloud-rent-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: flatcloud_rent
    user: flatcloud_app
    ipAllowList: []
