services:
  - type: web
    name: flatcloud-ux-sandbox
    runtime: node
    region: frankfurt
    plan: starter
    branch: sandbox/ux-agent
    buildCommand: npm ci --no-audit --no-fund && npm run build
    preDeployCommand: npm run db:migrate && npm run db:bootstrap
    initialDeployHook: npm run db:seed:demo
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: APP_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: flatcloud-ux-sandbox-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BANK_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_ADMIN_NAME
        value: UX Sandbox Admin
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: RESET_INITIAL_ADMIN_PASSWORD
        value: "false"
      # Deliberately no SMTP credentials, inbound-mail credentials,
      # production storage credentials, or scheduler/cron service.

databases:
  - name: flatcloud-ux-sandbox-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: flatcloud_ux_sandbox
    user: flatcloud_sandbox
    ipAllowList: []
